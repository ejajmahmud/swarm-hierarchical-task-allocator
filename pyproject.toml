[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-hierarchical-task-allocator"
version = "0.1.0"
description = "VCG auction and capability-weighted hierarchical task bidding allocator for heterogeneous agent swarms"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
swarm-hierarchical-task-allocator = "swarm_hierarchical_task_allocator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["swarm_hierarchical_task_allocator*"]
